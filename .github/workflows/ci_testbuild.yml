name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      IS_CI: 1

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.1.0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CI environment
        run: ./scripts/github-ci-pre.sh

      - name: Generate and lint docs
        run: ./scripts/github-ci-docs.sh

      - name: Build for testing
        run: ./scripts/github-ci-testbuild.sh

      - name: Run tests
        id: test
        run: ./scripts/github-ci-test.sh

      - name: Report test results
        uses: slidoapp/xcresulttool@v3.1.0
        with:
          path: build/TestResults.xcresult
          upload-bundles: never
        if: always()

      - name: Report test coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}
          plugin: xcode
          files: artifacts/coverage.xml

      - name: Upload artifacts (build log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: artifacts/build.log

      - name: Upload artifacts (test log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test.log
          path: artifacts/test.log

      - name: Upload artifacts (test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: artifacts/TestResults.xcresult

      - name: Upload artifacts (docstrings lint annotations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docstrings-lint-annotations.json
          path: artifacts/annotations.json

      - name: Upload artifacts (coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: artifacts/coverage.xml

      - name: Send notification (Push)
        if: ${{ always() && github.event_name == 'push' && github.repository == 'hammerspoon/hammerspoon' }}
        env:
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
          COMPARE_URL: ${{ github.event.compare }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TEST_RESULT: ${{ steps.test.outputs.test_result }}
        run: |
          MESSAGE=$(printf 'CI for %s (%s):\n  * %s\n  * %s' "$COMPARE_URL" "$AUTHOR_NAME" "$COMMIT_MESSAGE" "$TEST_RESULT")
          jq -n --arg secret "$CI_WEBHOOK_SECRET" --arg message "$MESSAGE" \
            '{secret: $secret, repository: "hammerspoon", workflow: "CI (Push)", message: $message}' \
            | /usr/bin/curl -H "X-CI-WebHook: true" -H "Content-Type: application/json" -d @- "$CI_WEBHOOK_URL"

      - name: Send notification (PR)
        if: ${{ always() && github.event_name == 'pull_request' && github.repository == 'hammerspoon/hammerspoon' && env.CI_WEBHOOK_URL != '' }}
        env:
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TEST_RESULT: ${{ steps.test.outputs.test_result }}
        run: |
          MESSAGE=$(printf 'CI for %s (%s)\n  * %s\n  * %s' "$PR_URL" "$PR_ACTOR" "$PR_TITLE" "$TEST_RESULT")
          jq -n --arg secret "$CI_WEBHOOK_SECRET" --arg message "$MESSAGE" \
            '{secret: $secret, repository: "hammerspoon", workflow: "CI (PR)", message: $message}' \
            | /usr/bin/curl -H "X-CI-WebHook: true" -H "Content-Type: application/json" -d @- "$CI_WEBHOOK_URL"
